name: Build and Release Rust Binary

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Binary in Release Mode
        run: cargo build --release

      - name: Package Project and Binary
        run: |
          mkdir -p release/package/project
          tar --exclude='.git' --exclude='target' --exclude='release' \
            -cf - . | tar -xf - -C release/package/project
          cp target/release/tlptk release/package/project/
          tar -czf release/tlptk.tar.gz -C release/package project

      - name: Upload Archive to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/tlptk.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
