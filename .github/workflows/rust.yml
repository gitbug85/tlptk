name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Binaries
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

      - name: Verify Binaries
        run: |
          test -d ./bin
          test "$(find ./bin -type f | wc -l)" -gt 0
          find ./bin -type f -exec chmod +x {} \;

      - name: Package Project
        run: |
          mkdir -p release/package/project
          tar --exclude='.git' --exclude='target' --exclude='release' \
            -cf - . | tar -xf - -C release/package/project

          cp -r ./bin release/package/project/

          tar -czf release/tlptk.tar.gz \
            -C release/package project

      - name: Install Flatpak Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Configure Flatpak
        run: |
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Create Flatpak Manifest
        run: |
          mkdir -p flatpak

          cat > flatpak/io.github.username.tlptk.yml <<'EOF'
          app-id: io.github.username.tlptk
          runtime: org.freedesktop.Platform
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          command: tlptk

          modules:
            - name: tlptk
              buildsystem: simple
              build-commands:
                - install -Dm755 bin/tlptk /app/bin/tlptk
              sources:
                - type: dir
                  path: ../bin
          EOF

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --force-clean \
            --repo=release/repo \
            release/build \
            flatpak/io.github.username.tlptk.yml

          flatpak build-bundle \
            release/repo \
            release/tlptk.flatpak \
            io.github.username.tlptk

      - name: Upload Archives to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/tlptk.tar.gz
            release/tlptk.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
