name: Build and Release Rust Binary

on:
  release:
    types: [published] # Triggers when you click "Publish release" in the GitHub UI, regardless of the tag name

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the runner to upload the compiled binary to the existing release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Binary in Release Mode
        run: cargo build --release

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/tlptk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
