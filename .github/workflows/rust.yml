name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nim
        run: |
          sudo apt-get update
          sudo apt-get install -y nim
          nim --version

      - name: Install dependencies
        run: |
          sudo apt install build-essential
          sudo apt install libpoppler-cpp-dev
          sudo apt install poppler-utils
          sudo apt install libjpeg-dev

      - name: Build Binaries
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

      - name: Verify Binaries
        run: |
          test -d ./bin
          test "$(find ./bin -type f | wc -l)" -gt 0
          find ./bin -type f -exec chmod +x {} \;

      - name: Package Project
        run: |
          mkdir -p release/package/project
          tar --exclude='.git' --exclude='target' --exclude='release' \
            -cf - . | tar -xf - -C release/package/project

          cp -r ./bin release/package/project/

          tar -czf release/tlptk.tar.gz \
            -C release/package project

      - name: Install Flatpak Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Configure Flatpak
        run: |
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --force-clean \
            --repo=release/repo \
            release/build \
            flatpak/io.github.gitbug85.tlptk.yml

          flatpak build-bundle \
            release/repo \
            release/tlptk.flatpak \
            io.github.gitbug85.tlptk

      - name: Upload Archives to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/tlptk.tar.gz
            release/tlptk.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
