<svg xmlns="http://www.w3.org/2000/svg"
     width="500" height="350"
     viewBox="0 0 500 350">

  <!-- First shape -->
  <circle cx="250" cy="175" r="100"
          fill="none" stroke="#333" stroke-width="3"/>

  <line x1="115" y1="175" x2="150" y2="175"
        stroke="#4ecdc4" stroke-width="4"/>
  <line x1="350" y1="175" x2="385" y2="175"
        stroke="#4ecdc4" stroke-width="4"/>

  <!-- Second SVG -->
  <svg x="175" y="100" width="150" height="150"
       viewBox="0 0 500 350">

    <!-- Third SVG -->
    <svg x="125" y="50" width="250" height="250"
         viewBox="0 0 500 350">

      <circle cx="250" cy="175" r="100"
              fill="none" stroke="#333" stroke-width="3"/>

      <line x1="115" y1="175" x2="150" y2="175"
            stroke="#4ecdc4" stroke-width="4"/>
      <line x1="350" y1="175" x2="385" y2="175"
            stroke="#4ecdc4" stroke-width="4"/>

    </svg>
  </svg>
</svg>
