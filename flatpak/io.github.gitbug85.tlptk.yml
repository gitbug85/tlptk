runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk

command: ui

modules:
  - name: tlptk
    buildsystem: simple
    build-commands:
      - install -d /app/bin
      - install -m755 bin/* /app/bin/

      - install -Dm644 assets/icon.png
        /app/share/icons/hicolor/512x512/apps/io.github.username.logo.png

      - install -Dm644 flatpak/io.github.username.tlptk.desktop
        /app/share/applications/io.github.username.tlptk.desktop

    sources:
      - type: dir
        path: ..
